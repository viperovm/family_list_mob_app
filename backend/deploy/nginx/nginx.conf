# Хостовый nginx (edge-прокси) для listsapp.djangopirate.ru.
# Положите этот файл в /etc/nginx/sites-available/listsapp.djangopirate.ru
# и сделайте symlink в sites-enabled.
#
# Статика раздаётся напрямую из host-каталогов, куда Docker-контейнер "web"
# сохраняет её через bind-mount (./staticfiles и ./media в backend/).

server {
    listen 80;
    server_name listsapp.djangopirate.ru;

    client_max_body_size 20m;

    # ПУТИ НА ХОСТЕ — замените <ABSOLUTE_BACKEND_DIR> на реальный путь,
    # например /home/viperovm/family_list_mob_app/backend
    set $backend_root /home/viperovm/family_list_mob_app/backend;

    location /static/ {
        alias $backend_root/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias $backend_root/media/;
        expires 30d;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 90s;
    }
}

